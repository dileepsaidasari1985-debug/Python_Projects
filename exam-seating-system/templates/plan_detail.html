{% extends "base.html" %}
{% block title %}{{ saved.plan_id }}{% endblock %}
{% block page_title %}{{ saved.plan_id }} &mdash; {{ saved.exam_title }}{% endblock %}
{% block content %}
<section class="card">
  <div class="card-header">
    <h3>Hall: {{ saved.hall_name }} ({{ saved.seating_mode }})</h3>
    <div class="no-print" style="display:flex;gap:0.5rem;">
      <button type="button" class="btn btn-outline btn-sm" onclick="window.print()">Print Seating Chart</button>
      <a href="{{ url_for('plans') }}" class="btn btn-outline btn-sm">Back to Plans</a>
    </div>
  </div>
  <pre class="ascii-box">{{ plan.ascii_chart }}</pre>
</section>
{% endblock %}
